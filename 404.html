<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"><title>Seite nicht gefunden</title>
<script>
// Groß-/Kleinschreibung egal: /Strassburg, /STRASSBURG, /straßburg -> /strassburg/
(function(){
  var p=decodeURIComponent(location.pathname).toLowerCase().replace(/ß/g,'ss');
  if(!/\/$/.test(p) && !/\.[a-z0-9]+$/.test(p)) p+='/';
  if(p!==location.pathname) location.replace(p+location.search+location.hash);
})();
</script>
