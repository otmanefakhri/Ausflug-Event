<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b1745">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%86%3C/text%3E%3C/svg%3E">
<title>Ausflug-Programm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--purple:#7F77DD;--purple-dark:#534AB7;--purple-darker:#3C3489;--purple-light:#EEEDFE;--purple-border:#AFA9EC;
--bg:#f0eeff;--white:#fff;--text:#1e1a3c;--muted:#5d6478;--border:#e2deff;--night:#1b1745;
--f-display:'Fredoka One','Arial Rounded MT Bold',system-ui,sans-serif;--f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:var(--night);font-family:var(--f-body);color:var(--text);}
.backdrop{position:fixed;inset:0;z-index:0;}
.backdrop svg{width:100%;height:100%;}
.snow{position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff 50%,transparent 51%),radial-gradient(2px 2px at 90px 120px,#fff 50%,transparent 51%),radial-gradient(3px 3px at 150px 60px,rgba(255,255,255,.9) 50%,transparent 51%),radial-gradient(2px 2px at 60px 170px,rgba(255,255,255,.8) 50%,transparent 51%),radial-gradient(3px 3px at 180px 180px,#fff 50%,transparent 51%);
  background-size:200px 200px;animation:snow 14s linear infinite;opacity:.85;}
@keyframes snow{from{background-position:0 0;}to{background-position:40px 200px;}}
@media (prefers-reduced-motion:reduce){.snow{animation:none;}}
main{position:relative;z-index:2;max-width:430px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));}
.head{text-align:center;color:#fff;margin-bottom:24px;}
.logo{width:76px;height:76px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 12px;}
.head h1{font-family:var(--f-display);font-weight:400;font-size:30px;text-shadow:0 2px 8px rgba(10,8,40,.6);}
.head p{font-size:14px;opacity:.9;margin-top:4px;text-shadow:0 2px 8px rgba(10,8,40,.6);}
.label{font-size:11px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:1.2px;margin:0 4px 10px;opacity:.9;}
.trip{display:flex;align-items:center;gap:14px;background:var(--white);border-radius:22px;padding:16px;text-decoration:none;color:var(--text);box-shadow:0 10px 30px rgba(10,8,40,.35);margin-bottom:12px;}
.trip:focus-visible{outline:3px solid var(--purple-border);outline-offset:3px;}
.trip-ic{width:58px;height:58px;border-radius:16px;background:var(--purple-light);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;}
.trip h2{font-size:17px;font-weight:800;}
.trip p{font-size:13px;color:var(--muted);margin-top:2px;}
.trip .date{display:inline-block;margin-top:6px;background:var(--purple-light);color:var(--purple-darker);font-size:11px;font-weight:800;padding:3px 10px;border-radius:50px;}
.trip .arrow{margin-left:auto;font-size:24px;color:var(--purple);}
.legal{position:relative;text-align:center;margin-top:22px;font-size:12px;color:rgba(255,255,255,.8);}
.legal a{color:#FAC775;font-weight:700;text-decoration:none;}
.flag{display:block;height:auto;border-radius:4px;border:1.5px solid #d6d2ee;}
.soon{background:rgba(255,255,255,.14);border:1.5px dashed rgba(255,255,255,.35);border-radius:22px;padding:16px;color:#fff;text-align:center;font-size:13px;font-weight:700;}
</style>
</head>
<body>

    </radialGradient>

<div class="backdrop" aria-hidden="true"><svg preserveAspectRatio="xMidYMax slice"><use href="#market"/></svg></div>
<div class="snow" aria-hidden="true"></div>
<main>
  <div class="head">
    <div class="logo" aria-hidden="true">🚆</div>
    <h1>Ausflug-Programm</h1>
    <p>Alle Infos zu unseren Schulausflügen</p>
  </div>
  <div class="label">Aktuelle Reisen</div>
  <a class="trip" href="/strassburg/">
    <span class="trip-ic"><svg class="flag" style="width:70%" viewBox="0 0 60 40" role="img" aria-label="Flagge von Straßburg"><rect width="60" height="40" fill="#fff"/><polygon points="0,0 13,0 60,31 60,40 47,40 0,9" fill="#D52B1E"/></svg></span>
    <span><h2>Ausflug nach Straßburg</h2><p>Altstadt, Münster &amp; Weihnachtsmarkt</p><span class="date">07.–09.12.2026</span></span>
    <span class="arrow" aria-hidden="true">›</span>
  </a>
  <div class="soon">Weitere Ausflüge folgen ✨</div>
  <p class="legal"><a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a></p>
